name: Verify Live ZimaOS and CasaOS Store Endpoints

on:
  workflow_dispatch:
    inputs:
      allow_empty:
        description: "Check source registration and transport only (no approved apps required)"
        type: boolean
        required: true
        default: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check public ZimaOS and CasaOS store files
        env:
          ALLOW_EMPTY: ${{ inputs.allow_empty }}
        run: |
          if [ "$ALLOW_EMPTY" = "true" ]; then
            python3 scripts/verify_public_store.py --allow-empty
          else
            python3 scripts/verify_public_store.py
          fi
