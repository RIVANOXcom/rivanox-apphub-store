name: Verify Live ZimaOS and CasaOS Store Endpoints

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check public ZimaOS and CasaOS store files
        run: python3 scripts/verify_public_store.py
